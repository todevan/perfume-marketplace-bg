project_id = "perfume-marketplace-bg"

[api]
enabled = true
port = 45321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 45322
shadow_port = 45320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 45323

[local_smtp]
enabled = true
port = 45324
smtp_port = 45325
pop3_port = 45326
admin_email = "beta-admin@example.invalid"
sender_name = "Perfume marketplace beta"

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/confirm",
  "http://127.0.0.1:5173/auth/confirm",
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 10
sms_sent = 10
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.invite]
subject = "Покана за затворената beta"
content_path = "./supabase/templates/invite.html"

[auth.sms]
enable_signup = false
enable_confirmations = true
template = "Кодът ти за потвърждение е {{ .Code }}"
max_frequency = "1m"

[auth.sms.test_otp]
359888000001 = "123456"

[analytics]
enabled = false

[functions.notification-email]
verify_jwt = false

[functions.upload-cleanup]
verify_jwt = false
