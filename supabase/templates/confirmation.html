<!doctype html>
<html lang="bg">
  <body style="margin:0;background:#f4ece1;color:#241c16;font-family:Arial,sans-serif">
    <main style="max-width:560px;margin:0 auto;padding:40px 24px">
      <p style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">Ароматика</p>
      <h1 style="font-size:30px;font-style:italic">Потвърдете регистрацията си</h1>
      <p>Потвърдете имейл адреса си, за да продължите със създаването на профила.</p>
      <p>
        <a
          href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email"
          style="display:inline-block;padding:13px 20px;border-radius:8px;background:#4a3126;color:#fff;text-decoration:none;font-weight:700"
        >Потвърди имейла</a>
      </p>
      <p style="font-size:12px;color:#6b5d52">Ако не сте заявили тази регистрация, не е необходимо да предприемате действие.</p>
    </main>
  </body>
</html>
