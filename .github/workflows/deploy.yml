name: deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_ORIGIN: https://perfume-marketplace-bg-staging.perfume-marketplace-bg.workers.dev
      EXPECTED_GIT_SHA: ${{ github.sha }}
      A7_REQUIRE_DISABLED_SIGNUP: "true"
      STAGING_SMOKE_ATTEMPTS: "6"
      STAGING_SMOKE_DELAY_MS: "5000"
      STAGING_SMOKE_TIMEOUT_MS: "5000"
      SAFE_ROLLBACK_VERSION: 75593db4-12fd-486d-ae8a-bdf9ebbb3ece
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Require successful complete CI for the exact SHA
        run: node scripts/verify-ci-checks.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Audit all dependencies at high severity
        run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm test:db:contracts
      - name: Validate staging Cloudflare bundle
        run: pnpm exec wrangler deploy --dry-run --env staging
      - name: Deploy staging Worker
        id: deploy
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke deployed closed-beta routes
        id: smoke
        run: node scripts/smoke-staging.mjs
      - name: Verify staging Turnstile action boundaries
        run: node scripts/verify-staging-turnstile.mjs
      - name: Restore safe Worker after failed smoke
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: >-
          pnpm exec wrangler versions deploy "$SAFE_ROLLBACK_VERSION"
          --env staging --yes
          --message "Automated rollback after failed staging smoke"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify fail-closed rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: node scripts/smoke-staging.mjs --mode rollback
        env:
          STAGING_SMOKE_ATTEMPTS: "12"
