name: operations-watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read

concurrency:
  group: issue29-monitor-watchdog
  cancel-in-progress: false

jobs:
  monitor-heartbeat:
    if: >-
      github.repository == 'todevan/perfume-marketplace-bg' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.workflow_ref == 'todevan/perfume-marketplace-bg/.github/workflows/operations-watchdog.yml@refs/heads/main' &&
      github.workflow_sha == github.sha && github.run_attempt == 1 &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Verify Cloudflare monitor heartbeat freshness
        env:
          MONITOR_HEARTBEAT_URL: ${{ vars.ISSUE29_MONITOR_HEARTBEAT_URL }}
          MONITOR_EXPECTED_ENVIRONMENT: ${{ vars.ISSUE29_MONITOR_ENVIRONMENT }}
          MONITOR_EXPECTED_RELEASE_SHA: ${{ vars.ISSUE29_MONITOR_RELEASE_SHA }}
          MONITOR_WATCHDOG_TOKEN: ${{ secrets.ISSUE29_MONITOR_WATCHDOG_TOKEN }}
        run: node scripts/issue29-operations/monitor-watchdog.mjs
